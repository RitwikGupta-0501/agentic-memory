<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark Rounded Container -->
  <rect width="32" height="32" rx="7" fill="#0A0E17"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" stroke="#A8C7FA" stroke-opacity="0.25"/>

  <!-- Connecting Graph Edges -->
  <path d="M16 6 L26 16 L16 26 L6 16 Z" stroke="#A8C7FA" stroke-width="1.2" stroke-opacity="0.45" stroke-dasharray="2 1"/>
  <path d="M16 6 L16 26" stroke="#A8C7FA" stroke-width="1.2" stroke-opacity="0.5"/>
  <path d="M6 16 L26 16" stroke="#A8C7FA" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- Central Aegis Core -->
  <circle cx="16" cy="16" r="3.75" fill="#A8C7FA"/>
  <circle cx="16" cy="16" r="1.75" fill="#042C6A"/>

  <!-- 4 Cognitive Memory Tiers -->
  <!-- Top: Working Memory (Gold) -->
  <circle cx="16" cy="6" r="2.75" fill="#FDD663"/>
  <!-- Right: Episodic Memory (Cyan/Sky) -->
  <circle cx="26" cy="16" r="2.75" fill="#78D9EC"/>
  <!-- Bottom: Semantic Memory (Mint) -->
  <circle cx="16" cy="26" r="2.75" fill="#81C995"/>
  <!-- Left: Procedural Memory (Purple) -->
  <circle cx="6" cy="16" r="2.75" fill="#C58AF9"/>
</svg>
