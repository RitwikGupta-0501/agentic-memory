[project]
name = "aegis-graph-backend"
version = "0.1.0"
description = "Multi-Tenant 4-Tier Cognitive Graph Memory & Multi-Agent Coordination Engine"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "falkordb>=1.8.0",
    "langchain>=1.4.0",
    "langchain-core>=1.6.0",
    "langgraph>=1.2.0",
    "langchain-falkordb>=0.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.4.0",
    "sse-starlette>=2.1.3",
    "httpx>=0.28.0",
    "numpy>=2.0.0",
    "langchain-google-genai>=4.4.2",
    "langchain-openai>=1.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]

asyncio_mode = "auto"
testpaths = ["tests"]
